name: Build PCB art job
run-name: Build job ${{ inputs.job_id }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (matches R2 prefix jobs/<job_id>/...)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install Python deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user svgpathtools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install AWS CLI (via pip)
        run: |
          python3 -m pip install --user --upgrade awscli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          aws --version

      - name: Prepare workspace
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/in work/out work/gerbers

          # Copy committed shell Gerbers into a working folder
          cp -R templates/shell/Gerbers/. work/gerbers/
          cp -R templates/shell/payload work/payload

          # Sanity check base mask exists
          test -f "work/gerbers/4-up-blank-F_Mask.gts"
          echo "Found base mask: work/gerbers/4-up-blank-F_Mask.gts"

      - name: Download SVG inputs from R2
        run: |
          set -euo pipefail
          JOB="${{ inputs.job_id }}"

          for i in 1 2 3 4; do
            KEY="jobs/${JOB}/in/slot${i}.svg"
            echo "Downloading s3://$R2_BUCKET/$KEY"
            aws s3 cp "s3://$R2_BUCKET/$KEY" "work/in/slot${i}.svg" --endpoint-url "$R2_ENDPOINT"
          done

      - name: Run SVG->Gerber append (4 placements)
        run: |
          set -euo pipefail

          python3 tools/append_svg_to_mask_gts.py \
            --base-gts "work/gerbers/4-up-blank-F_Mask.gts" \
            --out-gts  "work/gerbers/4-up-blank-F_Mask.gts" \
            --svg "work/in/slot1.svg" --place 62.93,30.4  --rotate 0 \
            --svg "work/in/slot2.svg" --place 62.93,43.4  --rotate 0 \
            --svg "work/in/slot3.svg" --place 86.65,30.45 --rotate 180 \
            --svg "work/in/slot4.svg" --place 86.67,43.45 --rotate 180

      - name: Install gerbv (for proof rendering)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gerbv

      - name: Render proof PNG
        run: |
          set -euo pipefail
          mkdir -p work/out

          # Render Edge Cuts + F_Mask into a proof PNG.
          # Notes:
          # -D controls DPI. 300 is usually readable; 600 is crisper but larger.
          # Some gerbv builds accept --dpi; on Ubuntu it's usually -D.
          gerbv \
            -x png \
            -D 400 \
            -o work/out/proof.png \
            work/gerbers/4-up-blank-Edge_Cuts.gm1 \
            work/gerbers/4-up-blank-F_Mask.gts

          test -s work/out/proof.png


      - name: Build bundle.zip (payload + Gerbers.zip)
        run: |
          set -euo pipefail
          mkdir -p work/out

          # Sanity checks
          test -d work/gerbers
          test -f work/gerbers/4-up-blank-F_Mask.gts

          # Ensure payload exists in the workspace (copied from templates)
          # If you already copy it earlier, keep this as just a sanity check.
          test -d work/payload
          test -f work/payload/bom.csv
          test -f work/payload/positions.csv
          test -f work/payload/readme.md

          # 1) Zip modified Gerbers into work/out/Gerbers.zip
          rm -f work/out/Gerbers.zip
          (cd work/gerbers && zip -q -r ../out/Gerbers.zip .)

          # 2) Create outer bundle.zip with Gerbers.zip + payload files at top level
          rm -f work/out/bundle.zip
          (cd work/out && zip -q bundle.zip Gerbers.zip)

          # -j = junk paths -> puts files at top of bundle.zip
          zip -q -j work/out/bundle.zip work/payload/bom.csv work/payload/positions.csv work/payload/readme.md

          ls -lh work/out/Gerbers.zip work/out/bundle.zip


      - name: Upload outputs to R2
        run: |
          set -euo pipefail
          JOB="${{ inputs.job_id }}"

          aws s3 cp "work/out/bundle.zip" "s3://$R2_BUCKET/jobs/${JOB}/out/bundle.zip" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "work/out/proof.png"  "s3://$R2_BUCKET/jobs/${JOB}/out/proof.png"  --endpoint-url "$R2_ENDPOINT"
 

          echo "Uploaded:"
          echo " - jobs/${JOB}/out/bundle.zip"
          echo " - jobs/${JOB}/out/proof.png"
      - name: Notify Pages that job is done
        env:
          JOB_ID: ${{ inputs.job_id }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SHARED_SECRET }}
          SITE_BASE: https://pcg.musicthing.co.uk
        run: |
          set -euo pipefail
          curl -sS -X POST "$SITE_BASE/api/job/$JOB_ID/update" \
            -H "content-type: application/json" \
            -H "x-runner-secret: $RUNNER_SECRET" \
            --data '{"status":"done"}'

