name: R2 smoketest
run-name: R2 smoketest by ${{ github.actor }}

on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI (via pip)
        run: |
          python3 -m pip install --user --upgrade pip awscli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          aws --version

      - name: Upload + list (R2)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          echo "hello $(date -u)" > hello.txt
          aws s3 cp hello.txt "s3://$R2_BUCKET/smoketest/hello.txt" --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://$R2_BUCKET/smoketest/" --endpoint-url "$R2_ENDPOINT"
